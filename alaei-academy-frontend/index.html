<div id="root"><div class="pre"><div><h1>آکادمی ریاضی</h1><p>استاد اعلایی‌نسب · ریاضی را بفهم، نه حفظ.</p></div></div></div>
<noscript><main style="max-width:900px;margin:auto;padding:24px;color:#E9F2F7;font-family:Vazirmatn,Tahoma,sans-serif"><h1>آکادمی ریاضی استاد اعلایی‌نسب</h1><p>ریاضی را بفهم، نه حفظ. پکیج‌های ویدیویی ریاضی پایه‌ی هفتم، هشتم و نهم با آموزش مفهومی استاد اعلایی‌نسب؛ تمرین هدفمند، جمع‌بندی شب امتحان، آمادگی امتحان نهایی و آزمون تیزهوشان، همراه با پشتیبانی واقعی.</p><h2>پکیج‌های ریاضی</h2><ul><li><a href="/pkg/p7a"><strong>ریاضی هفتم، از صفر تا بیست</strong></a> (پایه‌ی هفتم): همه‌ی فصل‌های کتاب هفتم با مثال‌های تصویری، تمرین‌های طبقه‌بندی‌شده و جمع‌بندی شب امتحان. قیمت: 890,000 تومان</li><li><a href="/pkg/p7b"><strong>جمع‌بندی شب امتحان هفتم</strong></a> (پایه‌ی هفتم): مرور سریع و نکته‌محور همه‌ی فصل‌ها برای روزهای آخر قبل از امتحان نوبت اول و دوم. قیمت: 390,000 تومان</li><li><a href="/pkg/p8a"><strong>ریاضی هشتم، مفهومی و عمیق</strong></a> (پایه‌ی هشتم): عددهای گویا تا دایره؛ هر جلسه با یک سؤال جذاب شروع و با تسلط کامل تمام می‌شود. قیمت: 950,000 تومان</li><li><a href="/pkg/p8b"><strong>هندسه‌ی هشتم با تصویر</strong></a> (پایه‌ی هشتم): مثلث، چندضلعی و دایره با انیمیشن‌های هندسی که اثبات‌ها را قابل‌دیدن می‌کنند. قیمت: 520,000 تومان</li><li><a href="/pkg/p9a"><strong>ریاضی نهم، آمادگی امتحان نهایی</strong></a> (پایه‌ی نهم): مجموعه‌ها تا معادله‌ی درجه دوم؛ کامل‌ترین مسیر برای نهایی و آزمون ورودی تیزهوشان. قیمت: 1,250,000 تومان</li><li><a href="/pkg/p9b"><strong>تیزهوشان نهم: تست و تکنیک</strong></a> (پایه‌ی نهم): تکنیک‌های تستی، مدیریت زمان و حل سؤال‌های سال‌های گذشته‌ی آزمون تیزهوشان. قیمت: 1,100,000 تومان</li></ul><h2>سؤالات متداول</h2><h3>بعد از خرید، چقدر طول می‌کشد پکیج فعال شود؟</h3><p>تأیید خرید دستی است؛ معمولاً کمتر از یک ساعت بعد از پرداخت، ادمین پکیج را در پنل شما فعال می‌کند.</p><h3>ویدیوها را می‌توانم دانلود کنم؟</h3><p>خیر. ویدیوها فقط به‌صورت آنلاین و داخل پنل دانش‌آموزی پخش می‌شوند تا محتوا محافظت شود.</p><h3>دسترسی به پکیج تا کی است؟</h3><p>دسترسی تا پایان سال تحصیلی همان پایه فعال است و ویدیوهای جدید هم بدون هزینه اضافه می‌شوند.</p><h3>اگر سؤالی داشتم از چه کسی بپرسم؟</h3><p>سؤال‌های درسی را در بخش «پرسش از استاد» مستقیم از خود استاد بپرسید؛ مشکلات فنی را به پشتیبانی بگویید.</p><h3>پرداخت امن است؟</h3><p>بله. پرداخت از طریق درگاه رسمی بانکی داخلی انجام می‌شود و هیچ اطلاعات کارتی روی سایت ما ذخیره نمی‌شود.</p><p>برای استفاده از امکانات کامل سایت، جاوااسکریپت مرورگر را فعال کنید.</p></main></noscript>
