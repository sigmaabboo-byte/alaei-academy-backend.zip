# Render Blueprint: one Node web service + one PostgreSQL database.
# Secrets are NOT stored here: JWT_SECRET / APP_SECRET are generated by Render, DATABASE_URL is injected from the database.
databases:
  - name: alaei-academy-db
    databaseName: alaei_academy
    user: alaei
    plan: free            # change to a paid plan for production (see README: free databases expire)

services:
  - type: web
    name: alaei-academy-backend
    runtime: node
    plan: free            # change to "starter" or higher to avoid cold starts
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alaei-academy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: SITE_URL
        sync: false         # set to your public URL in the Render dashboard
      - key: CORS_ORIGINS
        sync: false         # only if the frontend is hosted on another domain
      - key: AI_API_KEY
        sync: false         # optional
